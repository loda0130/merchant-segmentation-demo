<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f4f6f9" stroke="none"/><rect x="0" y="0" width="1440" height="52" rx="0" fill="#fff" stroke="none"/><text x="24" y="33" font-size="16" fill="#26354a" font-weight="600">运营工作台</text><text x="1180" y="33" font-size="13" fill="#718096" font-weight="400">商家管理　 /　 圈组</text><text x="24" y="82" font-size="12" fill="#718096" font-weight="400">商家管理 / 商家圈组</text><text x="24" y="122" font-size="22" fill="#26354a" font-weight="600">商家圈组</text><text x="24" y="149" font-size="12" fill="#718096" font-weight="400">按店铺条件持续圈选，人工决定保留优先级。</text><rect x="1270" y="99" width="146" height="34" rx="4" fill="#2584ed" stroke="#2584ed"/><text x="1282" y="121" font-size="13" fill="#fff" font-weight="400">＋ 创建圈组</text><rect x="24" y="170" width="1392" height="116" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="42" y="193" font-size="12" fill="#718096" font-weight="400">圈组名称 / ID</text><rect x="42" y="203" width="320" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="52" y="225" font-size="13" fill="#26354a" font-weight="400">输入名称或 ID</text><text x="380" y="193" font-size="12" fill="#718096" font-weight="400">状态</text><rect x="380" y="203" width="320" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="390" y="225" font-size="13" fill="#26354a" font-weight="400">全部状态　⌄</text><text x="718" y="193" font-size="12" fill="#718096" font-weight="400">自动新增</text><rect x="718" y="203" width="320" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="728" y="225" font-size="13" fill="#26354a" font-weight="400">全部　⌄</text><text x="1056" y="193" font-size="12" fill="#718096" font-weight="400">自动剔除</text><rect x="1056" y="203" width="340" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="1066" y="225" font-size="13" fill="#26354a" font-weight="400">全部　⌄</text><re