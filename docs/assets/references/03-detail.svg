ill="#fff" stroke="#e6ebf2"/><text x="1219" y="559" font-size="12" fill="#2584ed" font-weight="400">人工删除</text><text x="1219" y="580" font-size="12" fill="#2584ed" font-weight="400">2026-11-27 09:30:00</text><rect x="24" y="649" width="1392" height="88" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="42" y="678" font-size="14" fill="#26354a" font-weight="400">确认加入后：该店铺回到组内，人工决定更新为“手动保留”。</text><text x="42" y="707" font-size="13" fill="#718096" font-weight="400">候选执行前重新核对规则版本、匹配状态及成员状态；已过期或不适用项目跳过并说明原因。</text><text x="24" y="873" font-size="12" fill="#718096" font-weight="400">设计参考 · 全部数据为虚构示例 · 精确规则以 PRD 为准 · 非已完成业务页面</text></svg>