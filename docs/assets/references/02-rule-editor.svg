<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f4f6f9" stroke="none"/><rect x="0" y="0" width="1440" height="52" rx="0" fill="#fff" stroke="none"/><text x="24" y="33" font-size="16" fill="#26354a" font-weight="600">运营工作台</text><text x="1180" y="33" font-size="13" fill="#718096" font-weight="400">商家管理　 /　 圈组</text><text x="24" y="82" font-size="12" fill="#718096" font-weight="400">商家管理 / 商家圈组</text><text x="24" y="122" font-size="22" fill="#26354a" font-weight="600">圈组规则配置</text><text x="24" y="149" font-size="12" fill="#718096" font-weight="400">基本信息、圈选条件与自动维护分区呈现；保存后等待下一轮扫描。</text><rect x="200" y="169" width="1040" height="660" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="224" y="199" font-size="17" fill="#26354a" font-weight="600">创建圈组</text><text x="1195" y="199" font-size="22" fill="#718096" font-weight="400">×</text><text x="224" y="229" font-size="12" fill="#718096" font-weight="400">圈组名称 *</text><rect x="224" y="239" width="460" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="234" y="261" font-size="13" fill="#26354a" font-weight="400">潜力店铺组</text><text x="708" y="229" font-size="12" fill="#718096" font-weight="400">备注</text><rect x="708" y="239" width="508" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="718" y="261" font-size="13" fill="#26354a" font-weight="400">用于演示规则与人工保护</text><text x="224" y="300" font-size="15" fill="#26354a" font-weight="600">圈选条件</text><text x="224" y="327" font-size="12" fill="#718096" font-weight="400">店铺标签（每组命中任一标签；组间按显示括号组合）</text><rect x="224" y="342" width="992" height="46" rx="6" fill="#f7f9fc" stroke="#e6ebf2"/><text x="238" y="370" font-size="14" fill="#26354a" font-weight="400">组 1　标签 ID：101、102</text><text x="1090" y="370" font-size="13" fill="#2584ed" font-weight="400">删除组</text><rect x="224" y="396" width="992" height="46" rx="6" fill="#f7f9fc" stroke="#e6ebf2"/><text x="238" y="424" font-size="14" fill="#26354a" font-weight="400">且非　⌄　组 2　标签 ID：901</text><text x="1090" y="424" font-size="13" fill="#2584ed" font-weight="400">删除组</text><rect x="224" y="452" width="122" height="34" rx="4" fill="#fff" stroke="#e6ebf2"/><text x="236" y="474" font-size="13" fill="#2584ed" font-weight="400">＋ 添加条件组</text><text x="366" y="474" font-size="13" fill="#2584ed" font-weight="400">表达式：(标签组 1 且非 标签组 2)</text><text x="224" y="511" font-size="12" fill="#718096" font-weight="400">店铺类型（多选）</text><rect x="224" y="521" width="300" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="234" y="543" font-size="13" fill="#26354a" font-weight="400">☑ 海外仓　□ 集运　□ 自发货</text><text x="548" y="511" font-size="12" fill="#718096" font-weight="400">累计充值金额（EUR）</text><rect x="548" y="521" width="300" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="558" y="543" font-size="13" fill="#26354a" font-weight="400">1,000.00　至　不限</text><text x="872" y="511" font-size="12" fill="#718096" font-weight="400">主营大类（多选）</text><rect x="872" y="521" width="344" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="882" y="543" font-size="13" fill="#26354a" font-weight="400">不限</text><text x="224" y="582" font-size="12" fill="#718096" font-weight="400">是否自营</text><rect x="224" y="592" width="300" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="234" y="614" font-size="13" fill="#26354a" font-weight="400">否　⌄</text><text x="548" y="582" font-size="12" fill="#718096" font-weight="400">初始店铺 ID（选填）</text><rect x="548" y="592" width="300" height="34" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="558" y="614" font-size="13" fill="#26354a" font-weight="400">每行一个，按手动新增处理</text><text x="224" y="661" font-size="15" fill="#26354a" font-weight="600">自动维护</text><rect x="224" y="680" width="111" height="24" rx="3" fill="#e9f8ef" stroke="none"/><text x="232" y="697" font-size="12" fill="#148658" font-weight="400">自动新增：开启</text><rect x="420" y="680" width="111" height="24" rx="3" fill="#e9f8ef" stroke="none"/><text x="428" y="697" font-size="12" fill="#148658" font-weight="400">自动剔除：开启</text><text x="650" y="698" font-size="14" fill="#26354a" font-weight="400">全量扫描周期：每 24 小时</text><text x="224" y="735" font-size="13" fill="#b7740c" font-weight="400">手动新增或删除的店铺，仅提醒差异，不自动反向操作。</text><rect x="1010" y="777" width="80" height="34" rx="4" fill="#fff" stroke="#e6ebf2"/><text x="1022" y="799" font-size="13" fill="#2584ed" font-weight="400">取消</text><rect x="1102" y="777" width="114" height="34" rx="4" fill="#2584ed" stroke="#2584ed"/><text x="1114" y="799" font-size="13" fill="#fff" font-weight="400">保存规则</text><text x="24" y="873" font-size="12" fill="#718096" font-weight="400">设计参考 · 全部数据为虚构示例 · 精确规则以 PRD 为准 · 非已完成业务页面</text></svg>