<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f4f6f9" stroke="none"/><rect x="0" y="0" width="1440" height="52" rx="0" fill="#fff" stroke="none"/><text x="24" y="33" font-size="16" fill="#26354a" font-weight="600">运营工作台</text><text x="1180" y="33" font-size="13" fill="#718096" font-weight="400">商家管理　 /　 圈组</text><text x="24" y="82" font-size="12" fill="#718096" font-weight="400">商家管理 / 商家圈组</text><text x="24" y="122" font-size="22" fill="#26354a" font-weight="600">配置店铺与二次确认</text><text x="24" y="149" font-size="12" fill="#718096" font-weight="400">单次新增或删除；不包含标签 ID 与“本次变更”字段。</text><rect x="60" y="180" width="620" height="620" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="84" y="215" font-size="18" fill="#26354a" font-weight="600">配置店铺</text><text x="84" y="247" font-size="13" fill="#718096" font-weight="400">潜力店铺组 · G-1001</text><text x="84" y="291" font-size="13" fill="#718096" font-weight="400">操作类型 *</text><rect x="84" y="307" width="72" height="24" rx="3" fill="#e9f8ef" stroke="none"/><text x="92" y="324" font-size="12" fill="#148658" font-weight="400">● 新增</text><text x="216" y="325" font-size="14" fill="#26354a" font-weight="400">○ 删除</text><text x="84" y="369" font-size="13" fill="#718096" font-weight="400">店铺 ID *（每行一个）</text><rect x="84" y="385" width="572" height="180" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="100" y="413" font-size="14" fill="#26354a" font-weight="400">900007</text><text x="100" y="437" font-size="14" fill="#26354a" font-weight="400">900008</text><text x="100" y="461" font-size="14" fill="#26354a" font-weight="400">900007</text><text x="100" y="485" font-size="14" fill="#26354a" font-weight="400">abc</text><text x="84" y="593" font-size="13" fill="#26354a" font-weight="400">输入 4 行 · 去重后 3 项 · 有效 2 项 · 无效 1 项</text><text x="84" y="623" font-size="13" fill="#cb4c4c" font-weight="400">第 4 行 abc：仅支持数字店铺 ID，请修改或跳过。</text><text x="84" y="654" font-size="13" fill="#718096" font-weight="400">确认仅处理有效项；本次新增将记录为人工决定。</text><rect x="444" y="738" width="80" height="34" rx="4" fill="#fff" stroke="#e6ebf2"/><text x="456" y="760" font-size="13" fill="#2584ed" font-weight="400">取消</text><rect x="536" y="738" width="120" height="34" rx="4" fill="#2584ed" stroke="#2584ed"/><text x="548" y="760" font-size="13" fill="#fff" font-weight="400">确认新增</text><rect x="728" y="270" width="652" height="400" rx="6" fill="#fff" stroke="#e6ebf2"/><text x="752" y="307" font-size="18" fill="#26354a" font-weight="600">确认新增店铺</text><text x="752" y="356" font-size="14" fill="#26354a" font-weight="400">圈组：潜力店铺组（G-1001）</text><text x="752" y="391" font-size="14" fill="#26354a" font-weight="400">将新增 2 家店铺：900007、900008</text><text x="752" y="426" font-size="14" fill="#26354a" font-weight="400">重复 1 项，无效 1 项，不执行。</text><rect x="752" y="470" width="604" height="66" rx="6" fill="#fff5e4" stroke="#f2ddb4"/><text x="768" y="495" font-size="13" fill="#b7740c" font-weight="400">人工加入后，即使后续不满足圈选条件，</text><text x="768" y="518" font-size="13" fill="#b7740c" font-weight="400">系统也只提醒，不自动剔除。</text><rect x="1120" y="607" width="80" height="34" rx="4" fill="#fff" stroke="#e6ebf2"/><text x="1132" y="629" font-size="13" fill="#2584ed" font-weight="400">取消</text><rect x="1212" y="607" width="144" height="34" rx="4" fill="#2584ed" stroke="#2584ed"/><text x="1224" y="629" font-size="13" fill="#fff" font-weight="400">确认执行</text><text x="24" y="873" font-size="12" fill="#718096" font-weight="400">设计参考 · 全部数据为虚构示例 · 精确规则以 PRD 为准 · 非已完成业务页面</text></svg>